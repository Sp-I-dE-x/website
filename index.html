<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#070707">
    <meta
        name="description"
        content="Private access."
    >

    <title>Exclusive Access</title>

    <style>
        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-width: 320px;
            background: #070707;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            min-height: 100svh;
            min-height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                max(20px, env(safe-area-inset-top))
                max(18px, env(safe-area-inset-right))
                max(20px, env(safe-area-inset-bottom))
                max(18px, env(safe-area-inset-left));

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(255, 255, 255, 0.07),
                    transparent 42%
                ),
                linear-gradient(
                    180deg,
                    #0b0b0b 0%,
                    #050505 100%
                );

            color: #ffffff;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        /* =========================================================
           MAIN
        ========================================================= */

        .page {
            width: 100%;
            max-width: 520px;
        }

        /* =========================================================
           CARD
        ========================================================= */

        .card {
            width: 100%;

            padding:
                clamp(34px, 8vw, 52px)
                clamp(20px, 6vw, 34px);

            text-align: center;

            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;

            background:
                linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.055),
                    rgba(255, 255, 255, 0.025)
                );

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.48),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        /* =========================================================
           MAIN HEADING
        ========================================================= */

        h1 {
            font-size: clamp(40px, 10vw, 64px);
            font-weight: 800;

            line-height: 0.98;
            letter-spacing: -0.045em;

            color: #ffffff;

            overflow-wrap: anywhere;
        }

        /* =========================================================
           SECOND HEADING
        ========================================================= */

        h2 {
            margin-top: 14px;

            font-size: clamp(20px, 5vw, 27px);
            font-weight: 500;

            line-height: 1.15;
            letter-spacing: -0.02em;

            color: rgba(255, 255, 255, 0.70);
        }

        /* =========================================================
           TAGLINE
        ========================================================= */

        .tagline {
            margin-top: 12px;
            margin-bottom: clamp(30px, 7vw, 40px);

            font-size: clamp(13px, 3.5vw, 15px);
            font-weight: 500;

            line-height: 1.4;
            letter-spacing: 0.08em;

            color: rgba(255, 255, 255, 0.42);
        }

        /* =========================================================
           BUTTON
        ========================================================= */

        .join-button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            min-height: 70px;

            padding: 18px 24px;

            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 18px;

            background: #ffffff;
            color: #070707;

            text-decoration: none;

            font-size: clamp(16px, 4vw, 18px);
            font-weight: 800;
            line-height: 1;

            letter-spacing: 0.01em;

            cursor: pointer;
            user-select: none;
            touch-action: manipulation;

            -webkit-tap-highlight-color: transparent;

            transition:
                transform 0.12s ease,
                opacity 0.12s ease,
                box-shadow 0.12s ease;
        }

        .join-button:hover {
            opacity: 0.95;

            box-shadow:
                0 10px 30px rgba(255, 255, 255, 0.08);
        }

        .join-button:active {
            transform: scale(0.985);
        }

        .join-button:focus-visible {
            outline: 3px solid rgba(255, 255, 255, 0.45);
            outline-offset: 4px;
        }

        /* =========================================================
           SMALL PHONES
        ========================================================= */

        @media (max-width: 380px) {
            body {
                padding-left: 14px;
                padding-right: 14px;
            }

            .card {
                padding:
                    30px 15px 26px;

                border-radius: 22px;
            }

            h1 {
                font-size: 38px;
            }

            h2 {
                margin-top: 12px;
                font-size: 19px;
            }

            .tagline {
                margin-top: 10px;
                margin-bottom: 28px;

                font-size: 12px;
                letter-spacing: 0.06em;
            }

            .join-button {
                min-height: 64px;
                border-radius: 16px;
                padding-left: 18px;
                padding-right: 18px;
            }
        }

        /* =========================================================
           REDUCED MOTION
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {
            .join-button {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <section class="card">

            <h1>Exclusive Access</h1>

            <h2>Private Access</h2>

            <p class="tagline">
                Beyond Limits • Beyond Ordinary
            </p>

            <a
                class="join-button"
                href="https://t.me/addlist/3hu3GMYX8y02Mzcx"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Join Channel"
            >
                Join Channel ↗
            </a>

        </section>

    </main>

</body>
</html>
