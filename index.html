<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#070707">
  <meta name="description" content="Exclusive access.">

  <title>Exclusive Access</title>

  <style>
    :root {
      --bg: #070707;
      --surface: rgba(255, 255, 255, 0.045);
      --border: rgba(255, 255, 255, 0.10);
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-width: 320px;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;

      display: grid;
      place-items: center;

      padding:
        max(20px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));

      color: var(--text);

      background:
        radial-gradient(
          900px 500px at 50% -10%,
          rgba(255, 255, 255, 0.055),
          transparent 60%
        ),
        linear-gradient(
          180deg,
          #0a0a0a 0%,
          #050505 100%
        );

      font-family:
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    main {
      width: min(100%, 470px);
    }

    .card {
      width: 100%;

      padding:
        clamp(30px, 7vw, 44px)
        clamp(18px, 5vw, 30px);

      border: 1px solid var(--border);
      border-radius: 24px;

      background: var(--surface);

      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.035);

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    h1 {
      margin: 0 0 clamp(26px, 6vw, 34px);

      text-align: center;

      font-size: clamp(32px, 8vw, 44px);
      font-weight: 800;
      line-height: 1.04;
      letter-spacing: -0.035em;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 64px;

      padding: 16px 22px;

      border: 0;
      border-radius: 16px;

      background: #ffffff;
      color: #070707;

      text-decoration: none;
      text-align: center;

      font-size: 17px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.01em;

      cursor: pointer;
      user-select: none;
      touch-action: manipulation;

      transition:
        transform 120ms ease,
        opacity 120ms ease;
    }

    .button:hover {
      opacity: 0.94;
    }

    .button:active {
      transform: scale(0.985);
    }

    .button:focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.45);
      outline-offset: 4px;
    }

    @media (max-width: 420px) {
      .card {
        padding: 28px 16px;
        border-radius: 20px;
      }

      h1 {
        margin-bottom: 24px;
      }

      .button {
        min-height: 62px;
        border-radius: 15px;
        font-size: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .button {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <main>
    <section class="card" aria-label="Exclusive access">

      <h1>Exclusive Access</h1>

      <a
        class="button"
        href="https://t.me/addlist/3hu3GMYX8y02Mzcx"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Join channel"
      >
        Join Channel ↗
      </a>

    </section>
  </main>

</body>
</html>
