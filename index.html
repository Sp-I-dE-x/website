<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Private access page. Continue using the button below.">
  <title>Private Access</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.08), transparent 35%),
        linear-gradient(180deg, #0a0a0a 0%, #050505 100%);
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .card {
      width: min(100%, 430px);
      text-align: center;
      padding: 34px 24px 28px;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 24px;
      background: rgba(255,255,255,0.035);
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      backdrop-filter: blur(10px);
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 16px;
      padding: 7px 12px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      color: rgba(255,255,255,0.72);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 8vw, 42px);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    p {
      margin: 14px auto 26px;
      max-width: 320px;
      color: rgba(255,255,255,0.68);
      font-size: 15px;
      line-height: 1.55;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 58px;
      padding: 0 22px;
      border-radius: 16px;
      background: #ffffff;
      color: #050505;
      text-decoration: none;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.01em;
      transition: transform 0.16s ease, opacity 0.16s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .button:active {
      transform: scale(0.98);
    }

    .button:hover {
      opacity: 0.92;
    }

    .footer {
      margin-top: 18px;
      color: rgba(255,255,255,0.40);
      font-size: 11px;
    }

    @media (prefers-reduced-motion: reduce) {
      .button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <span class="eyebrow">Private Access</span>

    <h1>Continue</h1>

    <p>
      Use the button below to continue to the channel.
    </p>

    <a
      class="button"
      href="https://t.me/addlist/3hu3GMYX8y02Mzcx"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Join channel">
      Join Channel ↗
    </a>

    <div class="footer">Please review the destination before continuing.</div>
  </main>
</body>
</html>
