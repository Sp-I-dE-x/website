<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#070707">
    <meta name="description" content="Private access.">

    <title>Exclusive Access</title>

    <style>
        :root {
            --background: #070707;
            --card: rgba(255, 255, 255, 0.045);
            --border: rgba(255, 255, 255, 0.12);
            --text: #ffffff;
            --secondary: rgba(255, 255, 255, 0.70);
            --muted: rgba(255, 255, 255, 0.42);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            min-width: 320px;
            min-height: 100%;
            background: var(--background);
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            min-height: 100svh;
            min-height: 100dvh;

            display: grid;
            place-items: center;

            padding:
                max(22px, env(safe-area-inset-top))
                max(18px, env(safe-area-inset-right))
                max(22px, env(safe-area-inset-bottom))
                max(18px, env(safe-area-inset-left));

            background:
                radial-gradient(
                    950px 520px at 50% -12%,
                    rgba(255, 255, 255, 0.075),
                    transparent 62%
                ),
                linear-gradient(
                    180deg,
                    #0b0b0b 0%,
                    #050505 100%
                );

            color: var(--text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .page {
            width: 100%;
            max-width: 600px;
        }

        .card {
            width: 100%;
            padding:
                clamp(38px, 7vw, 52px)
                clamp(20px, 5vw, 34px);

            text-align: center;

            border: 1px solid var(--border);
            border-radius: 30px;

            background:
                linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.055),
                    rgba(255, 255, 255, 0.025)
                );

            box-shadow:
                0 30px 85px rgba(0, 0, 0, 0.48),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        h1 {
            font-size: clamp(40px, 9vw, 64px);
            font-weight: 800;
            line-height: 0.98;
            letter-spacing: -0.045em;
            color: var(--text);
        }

        h2 {
            margin-top: 15px;
            font-size: clamp(20px, 4.6vw, 27px);
            font-weight: 500;
            line-height: 1.15;
            letter-spacing: -0.02em;
            color: var(--secondary);
        }

        .tagline {
            margin-top: 12px;
            margin-bottom: clamp(32px, 6vw, 40px);
            font-size: clamp(12px, 3vw, 15px);
            font-weight: 500;
            line-height: 1.4;
            letter-spacing: 0.08em;
            color: var(--muted);
        }

        .join-button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            min-height: 76px;

            padding: 18px 24px;

            border: 1px solid rgba(255, 255, 255, 0.20);
            border-radius: 19px;

            background: #ffffff;
            color: #070707;

            text-decoration: none;
            text-align: center;

            font-size: clamp(16px, 3.8vw, 19px);
            font-weight: 800;
            line-height: 1;

            cursor: pointer;
            user-select: none;
            touch-action: manipulation;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.24);

            transition:
                transform 120ms ease,
                opacity 120ms ease,
                box-shadow 120ms ease;
        }

        .join-button:hover {
            opacity: 0.95;
            box-shadow:
                0 14px 34px rgba(0, 0, 0, 0.28);
        }

        .join-button:active {
            transform: scale(0.985);
        }

        .join-button:focus-visible {
            outline: 3px solid rgba(255, 255, 255, 0.42);
            outline-offset: 4px;
        }

        @media (max-width: 480px) {
            .card {
                border-radius: 24px;
                padding:
                    34px 18px
                    30px;
            }

            h1 {
                font-size: clamp(38px, 11vw, 52px);
            }

            h2 {
                margin-top: 12px;
            }

            .tagline {
                margin-bottom: 30px;
                letter-spacing: 0.065em;
            }

            .join-button {
                min-height: 72px;
                border-radius: 17px;
            }
        }

        @media (max-width: 360px) {
            body {
                padding-left: 12px;
                padding-right: 12px;
            }

            .card {
                padding-left: 14px;
                padding-right: 14px;
            }

            h1 {
                font-size: 36px;
            }

            h2 {
                font-size: 18px;
            }

            .tagline {
                font-size: 11px;
            }

            .join-button {
                min-height: 68px;
                font-size: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .join-button {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <section class="card" aria-label="Exclusive access">

            <h1>Exclusive Access</h1>

            <h2>Private Access</h2>

            <p class="tagline">
                Beyond Limits • Beyond Ordinary
            </p>

            <a
                class="join-button"
                href="https://t.me/addlist/3hu3GMYX8y02Mzcx"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Join Channel"
            >
                Join Channel ↗
            </a>

        </section>
    </main>
</body>
</html>
